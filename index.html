<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <title>表情ランナー</title>
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta name="apple-mobile-web-app-title" content="表情ランナー" />
  </head>
  <body style="margin: 0; min-height: 100vh; background: #0f172a; color: #ffffff">
    <div
      id="hardBootStamp"
      style="
        position: fixed;
        inset: 0;
        z-index: 2147483647;
        display: flex;
        align-items: center;
        justify-content: center;
        padding:
          calc(24px + env(safe-area-inset-top))
          calc(24px + env(safe-area-inset-right))
          calc(24px + env(safe-area-inset-bottom))
          calc(24px + env(safe-area-inset-left));
        background:
          radial-gradient(circle at top, rgba(251, 146, 60, 0.36), transparent 36%),
          linear-gradient(180deg, #3f1d0b, #7c2d12);
        color: #ffffff;
        pointer-events: auto;
        box-sizing: border-box;
      "
    >
      <div
        id="hardBootStampText"
        style="
          max-width: 760px;
          width: 100%;
          text-align: center;
          white-space: pre-line;
          font-family: -apple-system, BlinkMacSystemFont, 'Helvetica Neue', 'Hiragino Sans', sans-serif;
          font-size: clamp(24px, 4vw, 42px);
          line-height: 1.5;
          font-weight: 700;
          letter-spacing: 0.02em;
        "
      >表情ランナー
顔で走る、タップでも遊べる
起動中…</div>
    </div>

    <div id="appShell">
      <div id="gameStage">
        <video id="video" playsinline></video>
        <canvas id="gameCanvas"></canvas>
        <div id="uiRoot">
          <section class="boot-screen" data-boot-mode="loading">
            <div class="boot-card">
              <span class="eyebrow">loading</span>
              <h2>表情ランナーを起動中…</h2>
              <p>まもなく遊べます。横向きのままお待ちください。</p>
              <div class="boot-meta">
                <strong>準備中</strong>
                <span>ゲーム画面を整えています…</span>
              </div>
            </div>
          </section>
        </div>
      </div>
    </div>

    <script>
      (function () {
        window.__EMOTION_RUNNER_STATIC_HTML_LOADED__ = true;
        window.__EMOTION_RUNNER_BUILD__ = "15";
        var stampText = document.getElementById("hardBootStampText");

        function setLines(lines) {
          if (stampText) {
            stampText.textContent = lines.join("\n");
          }
        }

        setTimeout(function () {
          if (window.__EMOTION_RUNNER_APP_READY__ === true) return;
          setLines([
            "表情ランナー",
            "もう少しだけ準備しています…",
            "時間がかかる場合はアプリを再起動してください",
          ]);
        }, 2000);

        setTimeout(function () {
          if (window.__EMOTION_RUNNER_APP_READY__ === true) return;
          setLines([
            "表情ランナー",
            "起動に時間がかかっています",
            "再起動しても続く場合は、設定の診断情報を確認してください",
          ]);
        }, 5000);
      })();
    </script>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
